# ai-capital-v3 — client authentication, port 5433.
#
# THE CANONICAL INPUT. provision.sh installs this file verbatim into PGDATA.
#
# pg_hba.conf is FIRST-MATCH-WINS, and a rule that does not match is skipped
# rather than being an error. The order below is therefore load-bearing, and
# each rule is commented with what it admits and what it must not.
#
# ZERO `trust` RULES AND ZERO `replication` RULES. The 5432 cluster answers
# `trust` to every local connection for every role and every database, which
# means a command that means 5433 but reaches 5432 succeeds SILENTLY. Nothing
# here may repeat that.
#
# ADDING A CONSUMER LATER: insert the new rule ABOVE the catch-all rejects.
# Anything appended below rule 3 (local) or rule 6 (host) is dead, because an
# earlier reject already matched. That is deliberate — it means a careless
# append fails closed rather than quietly widening access — but it also means a
# rule added in the wrong place will look present and do nothing. Check the
# offline test in packages/db/tests/v3-cluster-artifacts.test.ts when editing.

# TYPE  DATABASE       USER                 ADDRESS        METHOD

# 1. The migrator, over the private mode-0700 Unix socket, to ai_capital_v3 and
#    nothing else. Narrowest rule first: it would also work below rule 2, whose
#    USER field excludes the migrator, but resting correctness on a coincidence
#    of non-matching is not the same as stating the intent.
#
#    This is the credential that runs migrations 001-019 and, later, the
#    Phase-H legacy copy. legacy-copy.ts refuses a TCP session outright
#    (assertTargetIdentity checks transport BEFORE socket path), so the copy
#    needs a working Unix path and must not have a working TCP one.
local   ai_capital_v3  ai_capital_migrator                 scram-sha-256

# 2. Superuser administration over the same private socket: initdb-adjacent
#    work, createdb, and the 000/010 bootstrap. `peer` authenticates against
#    the kernel-reported uid, so no password exists to leak.
local   all            thanapold                           peer

# 3. LOCAL CATCH-ALL REJECT. Without it, "no other local role can connect"
#    would rest on the ABSENCE of a rule — PostgreSQL's implicit final reject,
#    which is invisible to grep and to a reviewer. Stating it makes the property
#    checkable and makes an appended rule dead rather than newly permissive.
#    It also confines the migrator to ai_capital_v3: a migrator connection to
#    `postgres` or `template1` matches neither 1 nor 2 and lands here.
local   all            all                                 reject

# 4. The pipeline credential, IPv4 loopback only, to ai_capital_v3 only.
#    Scoped to the one role and the one database rather than `all`/`all`: the
#    migrator must NOT have a TCP path, and a broad `host all all` rule would
#    hand it one. A negative test that needs TCP reachable to be meaningful is
#    not a reason to open it — legacy-copy's TCP refusal is proved against
#    fakes in legacy-copy-contract.test.ts, where it belongs.
host    ai_capital_v3  ai_capital_pipeline  127.0.0.1/32   scram-sha-256

# 5-6. TCP CATCH-ALL REJECTS, both families. Redundant against
#      listen_addresses = '127.0.0.1', and kept anyway: if listen_addresses is
#      ever widened, the cluster must not silently become reachable. Defence in
#      depth, matching the REVOKE-before-GRANT idiom in 010_database_bootstrap.
host    all            all                  0.0.0.0/0      reject
host    all            all                  ::/0           reject
