# ai-capital-v3 — PostgreSQL 17 cluster settings, port 5433.
#
# THE CANONICAL INPUT. provision.sh installs this file verbatim; it is not a
# sample to copy and edit by hand. A second, editable copy living beside the
# cluster is how the reviewed configuration and the running configuration drift
# apart with nothing to notice it, so there is exactly one of these and the
# offline test asserts the script reads THIS path.
#
# Every setting below is stated explicitly. The 5432 cluster runs almost
# entirely on compiled-in defaults, which is fine for a developer instance and
# wrong for a migration target: a default is a value nobody chose, and it can
# change under a minor upgrade without appearing in any diff.

# ── Where it listens ────────────────────────────────────────────────────────
#
# 127.0.0.1 ONLY, as a literal — never `localhost`. On macOS `localhost`
# resolves to ::1 before 127.0.0.1, and the 5432 cluster binds both families.
# Binding one literal address, and writing the pipeline credential with the
# same literal, removes the ambiguity: a URL naming `localhost` fails closed
# rather than resolving to a family nobody intended.
port = 5433
listen_addresses = '127.0.0.1'

# The socket directory is NOT /tmp. The 5432 cluster keeps its socket in
# /private/tmp at mode 777 — acceptable for a trust-auth developer cluster,
# unacceptable here on two counts: a world-writable socket directory is the
# classic local-hijack surface, and the macOS temp reaper sweeps /private/tmp.
# That reaper destroyed a live worktree during S4F-D2.13; it must never be given
# the chance to unlink a socket out from under a running postmaster.
unix_socket_directories = '/Users/thanapold/ai-capital-v3-run'
unix_socket_permissions = 0700

# ── Authentication ──────────────────────────────────────────────────────────
#
# The cluster stores only the SCRAM verifier, never the plaintext.
password_encryption = 'scram-sha-256'

# Distinguishes this postmaster from the 5432 one in `ps` output, so an
# operator reading a process list can tell which cluster they are looking at.
cluster_name = 'ai-capital-v3'

# ── Logging ─────────────────────────────────────────────────────────────────
#
# Connections and disconnections are logged because the whole point of the HBA
# below is that only two principals can authenticate; an unexplained connection
# is the signal that something changed.
logging_collector = on
log_directory = 'log'
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = on
log_disconnections = on

# ── Locale and formatting, copied deliberately from the 5432 cluster ────────
#
# These are NOT cosmetic. default_text_search_config determines tsvector
# contents, so a divergence would give the target full-text indexes that
# disagree with the source's for identical input — a difference that survives a
# logical copy and shows up as wrong search results, not as an error.
datestyle = 'iso, mdy'
timezone = 'America/Los_Angeles'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
